[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator with DFS and BFS"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.md"}
authors = [{name = "Thamily and Guilherme"}]

[tool.setuptools]
packages = ["mazegen"]

[tool.mypy]
exclude = "^(build|dist|\\.venv)/"
